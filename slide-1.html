<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>React.js - My Learning Journey</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #0b1120;
            font-family: "Roboto", sans-serif;
        }

        /* =========================
           SLIDE CONTAINER
        ========================= */

        .slide-container {
            width: 1280px;
            height: 720px;

            position: relative;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(97, 218, 251, 0.08),
                    transparent 38%
                ),
                #0b1120;
        }

        /* =========================
           TOP ACCENT
        ========================= */

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 5px;

            background: #61DAFB;
        }

        /* =========================
           BACKGROUND SHAPES
        ========================= */

        .shape-one {
            position: absolute;

            width: 500px;
            height: 500px;

            right: -180px;
            top: -180px;

            border: 1px solid rgba(97, 218, 251, 0.08);
            border-radius: 50%;
        }

        .shape-two {
            position: absolute;

            width: 350px;
            height: 350px;

            left: -160px;
            bottom: -150px;

            border: 1px solid rgba(97, 218, 251, 0.05);
            border-radius: 50%;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .main-content {
            position: relative;
            z-index: 10;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 50px 100px;
        }

        /* =========================
           REACT LOGO
        ========================= */

        .logo-wrapper {
            margin-bottom: 20px;
        }

        .react-logo {
            font-size: 105px;
            color: #61DAFB;

            filter:
                drop-shadow(
                    0 0 18px rgba(97, 218, 251, 0.18)
                );
        }

        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {
            margin-bottom: 14px;

            color: #94a3b8;

            font-size: 14px;
            font-weight: 700;

            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        /* =========================
           MAIN TITLE
        ========================= */

        .main-title {
            margin: 0 0 38px 0;

            text-align: center;

            color: #f8fafc;

            font-size: 68px;
            line-height: 1.05;
            font-weight: 900;
        }

        .title-accent {
            color: #61DAFB;
        }

        /* =========================
           INFORMATION CARD
        ========================= */

        .info-card {
            width: 820px;
            min-height: 125px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px 40px;

            background: rgba(15, 23, 42, 0.92);

            border: 1px solid rgba(148, 163, 184, 0.15);
            border-left: 5px solid #61DAFB;

            border-radius: 12px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35),
                0 0 30px rgba(97, 218, 251, 0.04);
        }

        /* =========================
           PRESENTER
        ========================= */

        .presenter {
            flex: 1;
            text-align: center;
        }

        .label {
            margin-bottom: 7px;

            color: #64748b;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .presenter-name {
            color: #f1f5f9;

            font-size: 28px;
            font-weight: 700;
        }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            width: 1px;
            height: 55px;

            margin: 0 40px;

            background: rgba(148, 163, 184, 0.18);
        }

        /* =========================
           DATE
        ========================= */

        .date-section {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 14px;
        }

        .date-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(97, 218, 251, 0.08);

            color: #61DAFB;
        }

        .date {
            color: #cbd5e1;

            font-size: 17px;
            font-weight: 500;
        }

        /* =========================
           BOTTOM GLOW
        ========================= */

        .bottom-glow {
            position: absolute;

            width: 400px;
            height: 200px;

            left: 50%;
            bottom: -150px;

            transform: translateX(-50%);

            background: rgba(97, 218, 251, 0.12);

            filter: blur(80px);

            border-radius: 50%;
        }

        /* =========================
           NEXT BUTTON
        ========================= */

        .next-button {
            position: absolute;

            right: 35px;
            bottom: 28px;

            z-index: 50;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 10px 16px;

            color: #61DAFB;
            background: rgba(15, 23, 42, 0.9);

            border: 1px solid rgba(97, 218, 251, 0.25);
            border-radius: 8px;

            font-size: 13px;
            font-weight: 600;

            text-decoration: none;

            transition: all 0.2s ease;
        }

        .next-button:hover {
            background: rgba(97, 218, 251, 0.1);

            border-color: #61DAFB;

            transform: translateX(3px);
        }

        .next-button i {
            font-size: 14px;
        }

        /* =========================
           SLIDE NUMBER
        ========================= */

        .slide-number {
            position: absolute;

            right: 35px;
            bottom: 32px;

            color: #475569;

            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="slide-container">

        <!-- Top Accent -->
        <div class="top-bar"></div>

        <!-- Decorative Shapes -->
        <div class="shape-one"></div>
        <div class="shape-two"></div>


        <!-- Main Content -->
        <div class="main-content">

            <!-- React Logo -->
            <div class="logo-wrapper">
                <i class="fab fa-react react-logo"></i>
            </div>


            <!-- Subtitle -->
            <div class="subtitle">
                Frontend Library Overview
            </div>


            <!-- Main Title -->
            <h1 class="main-title">
                React.js
                <br>

                <span class="title-accent">
                    My Learning Journey
                </span>
            </h1>


            <!-- Information Card -->
            <div class="info-card">

                <!-- Presenter -->
                <div class="presenter">

                    <div class="label">
                        Presented By
                    </div>

                    <div class="presenter-name">
                        Khushal Wadile
                    </div>

                </div>


                <!-- Divider -->
                <div class="divider"></div>


                <!-- Date -->
                <div class="date-section">

                    <div class="date-icon">
                        <i class="fas fa-calendar-alt"></i>
                    </div>

                    <div class="date">
                        7 September 2026
                    </div>

                </div>

            </div>

        </div>


        <!-- Bottom Glow -->
        <div class="bottom-glow"></div>


        <!-- Next Slide -->
        <a
            href="slide-2.html"
            class="next-button"
            aria-label="Go to next slide"
        >
            <span>Next</span>
            <i class="fas fa-arrow-right"></i>
        </a>


        <!-- Slide Number -->
        <div class="slide-number">
            01
        </div>

    </div>

</body>
</html>
