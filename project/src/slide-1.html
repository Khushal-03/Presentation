<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>React.js - My Learning Journey</title>

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Roboto', sans-serif;

            background:
                radial-gradient(circle at 50% 35%,
                    rgba(97, 218, 251, 0.08),
                    transparent 38%),
                #0b1120;

            transform-origin: center center;
            transition: transform 0.2s ease;
        }

        /* Top Accent */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: #61DAFB;
            box-shadow: 0 0 12px rgba(97, 218, 251, 0.6);
        }

        /* Background Shapes with Subtle Floating Animation */
        .shape-one {
            position: absolute;
            width: 500px;
            height: 500px;
            border: 1px solid rgba(97, 218, 251, 0.08);
            border-radius: 50%;
            right: -180px;
            top: -180px;
            animation: shapeFloat 12s ease-in-out infinite alternate;
        }

        .shape-two {
            position: absolute;
            width: 350px;
            height: 350px;
            border: 1px solid rgba(97, 218, 251, 0.05);
            border-radius: 50%;
            left: -160px;
            bottom: -150px;
            animation: shapeFloat 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes shapeFloat {
            0% {
                transform: scale(1) rotate(0deg);
            }

            100% {
                transform: scale(1.08) rotate(15deg);
            }
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 10;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 50px 100px;
        }

        /* Logo with Smooth Infinite Spin & Glow */
        .logo-wrapper {
            margin-bottom: 22px;
        }

        .react-logo {
            display: inline-block;
            font-size: 105px;
            color: #61DAFB;
            filter: drop-shadow(0 0 18px rgba(97, 218, 251, 0.35));
            animation: spinReact 22s linear infinite, glowPulse 4s ease-in-out infinite alternate;
        }

        @keyframes spinReact {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes glowPulse {
            0% {
                filter: drop-shadow(0 0 14px rgba(97, 218, 251, 0.25));
            }

            100% {
                filter: drop-shadow(0 0 28px rgba(97, 218, 251, 0.6));
            }
        }

        /* Subtitle */
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            margin-bottom: 14px;
            animation: fadeInUp 0.7s ease-out both;
        }

        /* Main Title */
        .main-title {
            text-align: center;
            color: #f8fafc;
            font-size: 68px;
            line-height: 1.05;
            font-weight: 900;
            margin: 0 0 38px 0;
            animation: fadeInUp 0.9s ease-out both;
        }

        .title-accent {
            color: #61DAFB;
        }

        /* Information Card with smooth entrance & hover glow */
        .info-card {
            width: 820px;
            min-height: 125px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px 40px;

            background: rgba(15, 23, 42, 0.92);

            border: 1px solid rgba(148, 163, 184, 0.15);
            border-left: 5px solid #61DAFB;

            border-radius: 12px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35),
                0 0 30px rgba(97, 218, 251, 0.04);

            animation: fadeInUp 1.1s ease-out both;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(97, 218, 251, 0.15);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Presenter Section */
        .presenter {
            flex: 1;
            text-align: center;
        }

        .label {
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .presenter-name {
            color: #f1f5f9;
            font-size: 28px;
            font-weight: 700;
        }

        /* Divider */
        .divider {
            width: 1px;
            height: 55px;
            background: rgba(148, 163, 184, 0.18);
            margin: 0 40px;
        }

        /* Date */
        .date-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .date-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(97, 218, 251, 0.08);
            color: #61DAFB;
            transition: transform 0.3s ease;
        }

        .info-card:hover .date-icon {
            transform: scale(1.1);
        }

        .date {
            color: #cbd5e1;
            font-size: 17px;
            font-weight: 500;
        }

        /* Bottom Glow with Breathing Animation */
        .bottom-glow {
            position: absolute;
            width: 450px;
            height: 200px;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);

            background: rgba(97, 218, 251, 0.14);
            filter: blur(80px);
            border-radius: 50%;
            animation: glowBreath 6s ease-in-out infinite alternate;
        }

        @keyframes glowBreath {
            0% {
                opacity: 0.5;
                transform: translateX(-50%) scale(0.9);
            }

            100% {
                opacity: 1;
                transform: translateX(-50%) scale(1.2);
            }
        }

        /* ================= FULLSCREEN GPU FIX ================= */

        /* 1. Force GPU compositor to never freeze animations in fullscreen */
        .flow-card,
        .concept-card,
        .summary-card,
        .interactive-card,
        .step-badge,
        .point-num,
        .bulb-glow,
        .final-step-glow,
        .step-4-glow {
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translateZ(0);
            will-change: transform, box-shadow, border-color, opacity;
        }

        /* 2. Reliable Number Glow (Uses text-shadow instead of bug-prone drop-shadow) */
        .point-num,
        .hook-number {
            display: inline-block;
            animation: numberGlowPulse 2.8s ease-in-out infinite alternate !important;
        }

        @keyframes numberGlowPulse {
            0% {
                text-shadow: 0 0 2px rgba(97, 218, 251, 0.2);
                color: #61DAFB;
            }

            100% {
                text-shadow: 0 0 12px rgba(97, 218, 251, 0.9), 0 0 20px rgba(97, 218, 251, 0.4);
                color: #ffffff;
            }
        }

        /* 3. Card Outline Blink / Pulse (Works automatically in fullscreen) */
        .final-step-glow,
        .step-4-glow {
            animation: cardBlinkPulse 3s ease-in-out infinite alternate !important;
        }

        @keyframes cardBlinkPulse {
            0% {
                border-color: rgba(97, 218, 251, 0.2);
                box-shadow: 0 0 6px rgba(97, 218, 251, 0.08);
            }

            50% {
                border-color: rgba(97, 218, 251, 0.7);
                box-shadow: 0 0 18px rgba(97, 218, 251, 0.3), inset 0 0 8px rgba(97, 218, 251, 0.08);
            }

            100% {
                border-color: rgba(97, 218, 251, 0.35);
                box-shadow: 0 0 8px rgba(97, 218, 251, 0.12);
            }
        }
    </style>
</head>

<body>

    <div class="slide-container" id="slide">

        <!-- Top Accent -->
        <div class="top-bar"></div>

        <!-- Decorative Floating Shapes -->
        <div class="shape-one"></div>
        <div class="shape-two"></div>

        <!-- Main Content -->
        <div class="main-content">

            <!-- React Logo with Smooth Spin -->
            <div class="logo-wrapper">
                <i class="fab fa-react react-logo"></i>
            </div>

            <!-- Subtitle -->
            <div class="subtitle">
                Frontend Library Overview
            </div>

            <!-- Title -->
            <h1 class="main-title">
                React.js<br>
                <span class="title-accent">
                    My Learning Journey
                </span>
            </h1>

            <!-- Information Card -->
            <div class="info-card">

                <!-- Presenter -->
                <div class="presenter">
                    <div class="label">
                        Presented By
                    </div>
                    <div class="presenter-name">
                        Khushal Wadile
                    </div>
                </div>

                <!-- Divider -->
                <div class="divider"></div>

                <!-- Date -->
                <div class="date-section">
                    <div class="date-icon">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div class="date">
                        7 September 2026
                    </div>
                </div>

            </div>

        </div>

        <!-- Bottom Glow -->
        <div class="bottom-glow"></div>

    </div>

</body>

</html>
